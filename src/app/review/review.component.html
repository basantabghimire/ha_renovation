<div class="reviews-container">
  <h2>Customer Reviews</h2>
  
  <div *ngFor="let review of reviews" class="review-card">
    <h3>{{ review.name }}</h3>
    <p class="service-tag" *ngIf="review.services"><b>Project:</b> {{ review.services }}</p>
    <p class="rating">⭐ {{ review.rating }}/5</p>
    <p *ngIf="review.comment">"{{ review.comment }}"</p>
    <small>{{ review.timestamp | date:'shortDate' }}</small>
  </div>
</div>
