<div class="reviews-container">
  <h2>Customer Reviews</h2>
  
  <div *ngFor="let review of reviews" class="review-card">
    <h3>{{ review.name }}</h3>
    
    <!-- Using length check ensures "Project:" doesn't show up empty -->
    <p class="service-tag" *ngIf="review.services && review.services.length > 0">
      <b>Project:</b> {{ review.services }}
    </p>
    
    <p class="rating">⭐ {{ review.rating }}/5</p>
    
    <p *ngIf="review.comment && review.comment.length > 0">
      "{{ review.comment }}"
    </p>
    
    <!-- This will now display beautifully since timestamp is a real Date object -->
    <small *ngIf="review.timestamp">{{ review.timestamp | date:'shortDate' }}</small>
  </div>
</div>
